name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'

jobs:
  build-and-release:
    name: Build, Version Bump, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use Cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Bump Version
        id: bump-version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          git add package.json
          git commit -m "$NEW_VERSION"

          # Push the bump commit and its tag. Concurrent runs converge via rebase
          # and retries; a stale tag left by a failed run is repointed at HEAD.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git tag -f "v$NEW_VERSION" HEAD
            if git push origin main && git push origin "v$NEW_VERSION" --force; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Publish To npm
        id: publish
        run: |
          NEW_VERSION="${{ steps.bump-version.outputs.new_version }}"
          if npm view "@targoninc/lyda-shared@$NEW_VERSION" version >/dev/null 2>&1; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "@targoninc/lyda-shared@$NEW_VERSION is already on npm — skipping publish."
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          npm publish --access public

      - name: Create GitHub Release
        if: ${{ steps.publish.outputs.skipped != 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.bump-version.outputs.new_version }}
          name: Release v${{ steps.bump-version.outputs.new_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
